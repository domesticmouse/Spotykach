name: Deploy GitHub Pages (Web + Tutorial)

# Automatically deploys on pushes to main, or manually via Actions → Run workflow.
# Publishes web/ at the site root (/) and the compiled tutorial at /tutorial/.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy from
        required: false
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tutorial/requirements.txt
      - name: Install tutorial build dependencies
        run: pip install -r tutorial/requirements.txt
      - name: Build GitHub Pages site
        run: |
          mkdir -p _site
          cp -R web/. _site/
          touch _site/.nojekyll
          python3 tutorial/build.py --out-dir _site/tutorial --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
